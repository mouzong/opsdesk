# Optional: OpsDesk on PostgreSQL. Combine with the base file; the database container only starts when you ask for it:
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml up -d --build
# Requires POSTGRES_PASSWORD in .env (see .env.example). Starting from SQLite? Export JSON first and import it afterwards.
services:
  opsdesk:
    environment:
      OPSDESK_DB_CLIENT: postgres
      OPSDESK_DB_SSL: "off"          # private compose network between two containers; use TLS for any remote server
      OPSDESK_DATABASE_URL: postgres://opsdesk:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/opsdesk
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: opsdesk
      POSTGRES_DB: opsdesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - opsdesk-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsdesk -d opsdesk"]
      interval: 5s
      timeout: 5s
      retries: 20
    # No ports are published: only the opsdesk container can reach the database.
volumes:
  opsdesk-postgres:
