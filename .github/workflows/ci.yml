# CI definition. Assumption: the project is hosted on GitHub. The repository had no CI configuration and no remote
# when this file was added, so this workflow has NOT been executed on GitHub yet (see docs: "Documentation toolchain").
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  app:
    name: Application (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  databases:
    name: Integration tests (PostgreSQL and MySQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: opsdesk
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: opsdesk_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U opsdesk" --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-root
          MYSQL_USER: opsdesk
          MYSQL_PASSWORD: ci-only-password
          MYSQL_DATABASE: opsdesk_test
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uopsdesk -pci-only-password --silent" --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          TEST_POSTGRES_URL: postgres://opsdesk:ci-only-password@127.0.0.1:5432/opsdesk_test
          TEST_MYSQL_URL: mysql://opsdesk:ci-only-password@127.0.0.1:3306/opsdesk_test

  docs:
    name: Documentation (strict build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      # --strict turns broken internal links, missing anchors, pages outside the navigation and
      # configuration warnings into a failing build.
      - run: mkdocs build --strict
        env:
          NO_MKDOCS_2_WARNING: 'true'
